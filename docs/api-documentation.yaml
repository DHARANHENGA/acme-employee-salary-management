openapi: 3.0.3

info:
  title: ACME Employee Salary Management API
  description: |
    API for managing employee salary information and providing
    organizational salary analytics.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api
    description: Local development server

tags:
  - name: Employees
    description: Employee management operations
  - name: Analytics
    description: Organizational salary analytics
  - name: Reference Data
    description: Departments, countries and currencies

paths:

  # ============================================================
  # EMPLOYEES
  # ============================================================

  /employees:
    get:
      tags:
        - Employees
      summary: Get employees
      description: |
        Returns a paginated list of employees.

        Supports:
        - Search by employee ID or name
        - Filtering by department
        - Filtering by country
        - Filtering by status
        - Filtering by joining date range
        - Sorting
        - Pagination

        Joining date filtering rules:
        - joinedFrom must be less than or equal to joinedTo.
        - joinedFrom can be provided without joinedTo.
        - joinedTo can be provided without joinedFrom.
        - All filtering, sorting and pagination operations are performed by the backend.
      parameters:
        - name: page
          in: query
          required: false
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: limit
          in: query
          required: false
          description: Number of employees per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10

        - name: search
          in: query
          required: false
          description: Search by employee name
          schema:
            type: string
            example: Arun

        - name: departmentId
          in: query
          required: false
          description: Filter by department
          schema:
            type: integer
            example: 2

        - name: countryId
          in: query
          required: false
          description: Filter by country
          schema:
            type: integer
            example: 1

        - name: status
          in: query
          required: false
          description: Filter by employee status
          schema:
            $ref: '#/components/schemas/EmployeeStatus'

        - name: joinedFrom
          in: query
          required: false
          description: Filter employees who joined on or after this date
          schema:
            type: string
            format: date
          example: '2024-01-01'

        - name: joinedTo
          in: query
          required: false
          description: Filter employees who joined on or before this date
          schema:
            type: string
            format: date
          example: '2026-08-29'

        - name: sortBy
          in: query
          required: false
          description: Field used to sort employees
          schema:
            type: string
            enum:
              - employeeId
              - name
              - dateJoined
              - salary
            default: employeeId
          example: name

        - name: sortOrder
          in: query
          required: false
          description: Sort direction
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
          example: asc

      responses:
        '200':
          description: Employees retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeListResponse'

        '400':
          $ref: '#/components/responses/BadRequest'

        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Employees
      summary: Create employee
      description: |
        Creates a new employee.

        The employeeId is generated by the backend.
        Currency is determined automatically from the selected country.
        The frontend must not provide currencyId.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'

      responses:
        '201':
          description: Employee created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeResponse'

        '400':
          $ref: '#/components/responses/BadRequest'

        '500':
          $ref: '#/components/responses/InternalServerError'


  # ============================================================
  # UPDATE EMPLOYEE
  # ============================================================

  /employees/{employeeId}:
    put:
      tags:
        - Employees
      summary: Update employee
      description: |
        Updates employee details and salary information.

        Currency is determined automatically from the selected country.
        The frontend must not provide currencyId.

      parameters:
        - name: employeeId
          in: path
          required: true
          description: Employee business identifier
          schema:
            type: string
            example: EMP-00123

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRequest'

      responses:
        '200':
          description: Employee updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationResponse'

        '400':
          $ref: '#/components/responses/BadRequest'

        '404':
          $ref: '#/components/responses/EmployeeNotFound'

        '500':
          $ref: '#/components/responses/InternalServerError'


  # ============================================================
  # DEACTIVATE EMPLOYEE
  # ============================================================

  /employees/{employeeId}/deactivate:
    patch:
      tags:
        - Employees
      summary: Deactivate employee
      description: |
        Soft-deactivates an employee.

        The employee record remains in the database so that
        organizational analytics remain historically accurate.

      parameters:
        - name: employeeId
          in: path
          required: true
          description: Employee business identifier
          schema:
            type: string
            example: EMP-00123

      responses:
        '200':
          description: Employee deactivated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/responses/EmployeeDeactivatedResponse'

        '404':
          $ref: '#/components/responses/EmployeeNotFound'

        '409':
          description: Employee is already inactive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          $ref: '#/components/responses/InternalServerError'


  # ============================================================
  # ANALYTICS
  # ============================================================

  /analytics:
    get:
      tags:
        - Analytics
      summary: Get salary analytics
      description: |
        Returns organizational salary analytics.

        When no filters are supplied, analytics are calculated
        for the entire organization.

        When filters are supplied, all KPI metrics and analytical
        visualizations are calculated for the filtered employee set.

        Supported filters:
        - Country
        - Department
        - Employee status

        Salary values are stored in each employee's native currency.
        Cross-country analytics are normalized to USD using the
        configured exchange rate table.

        All analytics calculations are performed by the backend.

      parameters:
        - name: countryId
          in: query
          required: false
          description: Filter analytics by country
          schema:
            type: integer
            example: 1

        - name: departmentId
          in: query
          required: false
          description: Filter analytics by department
          schema:
            type: integer
            example: 2

        - name: status
          in: query
          required: false
          description: Filter analytics by employee status
          schema:
            $ref: '#/components/schemas/EmployeeStatus'

      responses:
        '200':
          description: Salary analytics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResponse'

        '400':
          $ref: '#/components/responses/BadRequest'

        '500':
          $ref: '#/components/responses/InternalServerError'


  # ============================================================
  # REFERENCE DATA
  # ============================================================

  /departments:
    get:
      tags:
        - Reference Data
      summary: Get departments
      description: Returns all active departments.

      responses:
        '200':
          description: Departments retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentListResponse'

        '500':
          $ref: '#/components/responses/InternalServerError'


  /countries:
    get:
      tags:
        - Reference Data
      summary: Get countries
      description: |
        Returns all supported countries.
        Each country has one default/native currency.

      responses:
        '200':
          description: Countries retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryListResponse'

        '500':
          $ref: '#/components/responses/InternalServerError'


  /currencies:
    get:
      tags:
        - Reference Data
      summary: Get currencies
      description: Returns all supported currencies.

      responses:
        '200':
          description: Currencies retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyListResponse'

        '500':
          $ref: '#/components/responses/InternalServerError'


# ==============================================================
# COMPONENTS
# ==============================================================

components:

  schemas:

    # ==========================================================
    # EMPLOYEE
    # ==========================================================

    Employee:
      type: object
      required:
        - employeeId
        - name
        - department
        - jobTitle
        - country
        - dateJoined
        - salary
        - currency
        - status

      properties:
        employeeId:
          type: string
          example: EMP-00123

        name:
          type: string
          example: Arun Kumar

        department:
          type: string
          example: Engineering

        jobTitle:
          type: string
          example: Software Engineer

        country:
          type: string
          example: India

        dateJoined:
          type: string
          format: date
          example: '2024-07-01'

        salary:
          type: number
          format: double
          minimum: 0
          example: 1500000

        currency:
          type: string
          description: Native currency determined by the employee's country.
          example: INR

        status:
          $ref: '#/components/schemas/EmployeeStatus'


    EmployeeStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
      example: ACTIVE


    # ==========================================================
    # CREATE EMPLOYEE
    # ==========================================================

    CreateEmployeeRequest:
      type: object
      required:
        - name
        - departmentId
        - jobTitle
        - countryId
        - dateJoined
        - salary

      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          example: Arun Kumar

        departmentId:
          type: integer
          example: 2

        jobTitle:
          type: string
          minLength: 1
          maxLength: 100
          example: Software Engineer

        countryId:
          type: integer
          example: 1

        dateJoined:
          type: string
          format: date
          example: '2026-08-29'

        salary:
          type: number
          format: double
          minimum: 0
          example: 1500000


    # ==========================================================
    # UPDATE EMPLOYEE
    # ==========================================================

    UpdateEmployeeRequest:
      type: object
      required:
        - name
        - departmentId
        - jobTitle
        - countryId
        - dateJoined
        - salary

      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
          example: Arun Kumar

        departmentId:
          type: integer
          example: 2

        jobTitle:
          type: string
          minLength: 1
          maxLength: 100
          example: Senior Software Engineer

        countryId:
          type: integer
          example: 1

        dateJoined:
          type: string
          format: date
          example: '2026-08-29'

        salary:
          type: number
          format: double
          minimum: 0
          example: 1800000


    # ==========================================================
    # EMPLOYEE RESPONSES
    # ==========================================================

    EmployeeResponse:
      type: object
      required:
        - status
        - code
        - message
        - data

      properties:
        status:
          type: string
          enum:
            - success
          example: success

        code:
          type: string
          example: EMPLOYEE_CREATED

        message:
          type: string
          example: Employee created successfully

        data:
          $ref: '#/components/schemas/Employee'


    EmployeeListResponse:
      type: object
      required:
        - status
        - code
        - message
        - data
        - pagination

      properties:
        status:
          type: string
          enum:
            - success
          example: success

        code:
          type: string
          example: EMPLOYEES_RETRIEVED

        message:
          type: string
          example: Employees retrieved successfully

        data:
          type: array
          items:
            $ref: '#/components/schemas/Employee'

        pagination:
          $ref: '#/components/schemas/Pagination'


    OperationResponse:
      type: object
      required:
        - status
        - code
        - message
        - data

      properties:
        status:
          type: string
          enum:
            - success
          example: success

        code:
          type: string
          example: EMPLOYEE_UPDATED

        message:
          type: string
          example: Employee updated successfully

        data:
          nullable: true
          example: null


    # ==========================================================
    # PAGINATION
    # ==========================================================

    Pagination:
      type: object
      required:
        - page
        - limit
        - total
        - totalPages

      properties:
        page:
          type: integer
          example: 1

        limit:
          type: integer
          example: 20

        total:
          type: integer
          example: 10000

        totalPages:
          type: integer
          example: 500


    # ==========================================================
    # ANALYTICS
    # ==========================================================

    AnalyticsResponse:
      type: object
      required:
        - status
        - code
        - message
        - data

      properties:
        status:
          type: string
          enum:
            - success
          example: success

        code:
          type: string
          example: ANALYTICS_RETRIEVED

        message:
          type: string
          example: Salary analytics retrieved successfully

        data:
          $ref: '#/components/schemas/AnalyticsData'


    AnalyticsData:
      type: object
      required:
        - summary
        - byCountry
        - byDepartment
        - salaryBands

      properties:
        summary:
          $ref: '#/components/schemas/AnalyticsSummary'

        byCountry:
          type: array
          items:
            $ref: '#/components/schemas/CountrySalaryAnalytics'

        byDepartment:
          type: array
          items:
            $ref: '#/components/schemas/DepartmentSalaryAnalytics'

        salaryBands:
          type: array
          items:
            $ref: '#/components/schemas/SalaryBand'


    AnalyticsSummary:
      type: object
      required:
        - totalPayroll
        - averageSalary
        - medianSalary
        - employeeCount
        - currency

      properties:
        totalPayroll:
          type: number
          format: double
          example: 125400000

        averageSalary:
          type: number
          format: double
          example: 62400

        medianSalary:
          type: number
          format: double
          example: 55000

        employeeCount:
          type: integer
          example: 8642

        currency:
          type: string
          description: Reporting currency used for organization-level analytics.
          example: USD


    CountrySalaryAnalytics:
      type: object
      required:
        - country
        - employeeCount
        - averageSalary
        - medianSalary
        - totalPayroll
        - currency

      properties:
        country:
          type: string
          example: India

        employeeCount:
          type: integer
          example: 4000

        averageSalary:
          type: number
          format: double
          example: 18000

        medianSalary:
          type: number
          format: double
          example: 16000

        totalPayroll:
          type: number
          format: double
          example: 72000000

        currency:
          type: string
          description: Reporting currency.
          example: USD


    DepartmentSalaryAnalytics:
      type: object
      required:
        - department
        - employeeCount
        - averageSalary
        - medianSalary
        - totalPayroll
        - currency

      properties:
        department:
          type: string
          example: Engineering

        employeeCount:
          type: integer
          example: 3200

        averageSalary:
          type: number
          format: double
          example: 72000

        medianSalary:
          type: number
          format: double
          example: 68000

        totalPayroll:
          type: number
          format: double
          example: 230400000

        currency:
          type: string
          description: Reporting currency.
          example: USD


    SalaryBand:
      type: object
      required:
        - band
        - employeeCount
        - percentage

      properties:
        band:
          type: string
          example: 50K-75K

        employeeCount:
          type: integer
          example: 3100

        percentage:
          type: number
          format: double
          example: 35.87


    # ==========================================================
    # REFERENCE DATA
    # ==========================================================

    Department:
      type: object
      required:
        - id
        - name

      properties:
        id:
          type: integer
          example: 2

        name:
          type: string
          example: Engineering


    Country:
      type: object
      required:
        - id
        - name
        - code
        - currency

      properties:
        id:
          type: integer
          example: 1

        name:
          type: string
          example: India

        code:
          type: string
          example: IN

        currency:
          $ref: '#/components/schemas/Currency'


    Currency:
      type: object
      required:
        - id
        - code
        - name
        - symbol

      properties:
        id:
          type: integer
          example: 1

        code:
          type: string
          example: INR

        name:
          type: string
          example: Indian Rupee

        symbol:
          type: string
          example: ₹


    DepartmentListResponse:
      type: object
      required:
        - status
        - code
        - message
        - data

      properties:
        status:
          type: string
          enum:
            - success
          example: success

        code:
          type: string
          example: DEPARTMENTS_RETRIEVED

        message:
          type: string
          example: Departments retrieved successfully

        data:
          type: array
          items:
            $ref: '#/components/schemas/Department'


    CountryListResponse:
      type: object
      required:
        - status
        - code
        - message
        - data

      properties:
        status:
          type: string
          enum:
            - success
          example: success

        code:
          type: string
          example: COUNTRIES_RETRIEVED

        message:
          type: string
          example: Countries retrieved successfully

        data:
          type: array
          items:
            $ref: '#/components/schemas/Country'


    CurrencyListResponse:
      type: object
      required:
        - status
        - code
        - message
        - data

      properties:
        status:
          type: string
          enum:
            - success
          example: success

        code:
          type: string
          example: CURRENCIES_RETRIEVED

        message:
          type: string
          example: Currencies retrieved successfully

        data:
          type: array
          items:
            $ref: '#/components/schemas/Currency'


    # ==========================================================
    # ERRORS
    # ==========================================================

    ErrorResponse:
      type: object
      required:
        - status
        - code
        - message
        - data

      properties:
        status:
          type: string
          enum:
            - error
          example: error

        code:
          type: string
          example: VALIDATION_ERROR

        message:
          type: string
          example: Request validation failed

        data:
          nullable: true
          example:
            salary: Salary must be greater than or equal to 0


    NotFoundResponse:
      type: object
      required:
        - status
        - code
        - message
        - data

      properties:
        status:
          type: string
          enum:
            - error
          example: error

        code:
          type: string
          example: NOT_FOUND

        message:
          type: string
          example: Not found

        data:
          nullable: true
          example: null


    InternalServerErrorResponse:
      type: object
      required:
        - status
        - code
        - message
        - data

      properties:
        status:
          type: string
          enum:
            - error
          example: error

        code:
          type: string
          example: INTERNAL_SERVER_ERROR

        message:
          type: string
          example: An unexpected error occurred

        data:
          nullable: true
          example: null


  # ============================================================
  # COMMON RESPONSES
  # ============================================================

  responses:

    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'


    EmployeeNotFound:
      description: Employee does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundResponse'


    EmployeeDeactivatedResponse:
      description: Employee deactivated successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationResponse'


    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalServerErrorResponse'

